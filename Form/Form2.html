<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
</head>
<body>
    <form >
        <fieldset>
            <legend>User personal information</legend>
            <label for="Name">Enter your full name</label>
            <br>
            <input type="text" id="Name" name="UserName">
            <br>

            <label for="email">Enter your email</label>
            <br>
            <input type="email" id="email" name="Email">
            <br>


            <label for="pass">Enter your password</label>
            <br>
            <input type="password" id="pass" name="pass">
            <br>

            <label for="Conmpass">Confirm your password</label>
            <br>
            <input type="password" id="Conmpass" name="Conmpass">
            <br>

            <label > Enter your gender</label>
            <br>
            <input type="radio" name="gender" id="M" value="Male">
            <label for="M">Male</label>

            <input type="radio" name="gender" id="F" value="FeMale">
            <label for="F">Fe   Male</label>

            <input type="radio" name="gender" id="O" value="Other">
            <label for="O">Others</label>
            <br>

            <label for="date">Enter your Date of Birth</label>
            <br>
            <input type="date" name="Date" id="date">
            <br>

            <label for="add">Enter your Address :</label>
            <br>
            <textarea name="address" id="add" cols="40" rows="20"></textarea>

            <br>
            <br>
            <input type="submit">

        </fieldset>
    </form>
</body>
</html>
