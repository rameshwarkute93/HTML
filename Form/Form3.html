<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 3</title>
</head>
<body style="text-align: center;">
    <form>
        <h1>Application Form</h1>

        <label for="name"> First Name : </label>
        <input type="text" id="name" name="Username">
        <br>
        <br>

        <label for="lastname"> Last Name : </label>
        <input type="text" id="lastname" name="Lastname">
        <br>
        <br>

        <label for="date"> Date of birth : </label>
        <input type="date" id="date" name="Date">
        <br>
        <br>

        <label for="age"> Age : </label>
        <input type="text" id="age" name="Age">
        <br>
        <br>

        <label > Gender : </label>
        <select name="Gender" >
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <br>
        <br>

        <label for="email"> Email Address : </label>
        <input type="email" id="email" name="Email">
        <br>
        <br>

        <label >Positins Available : </label>
        <input type="radio" name="position" id="jd" value="Junior_Developer" >
        <label for="jd">Junior Developer</label>

        <input type="radio" name="position" id="md" value="Mid-level_Developer">
        <label for="md">Mid-level Developer</label>

        <input type="radio" name="position" id="sd" value="Senior_Developer">
        <label for="sd">Senior Developer</label>


        <br>
        <br>

        <label >Programming Languages : </label>
        <input type="checkbox" name="Programming_Language" value="Java" >
        <label for="java">Java</label>

        <input type="checkbox" name="Programming_Language" value="Javascript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" name="Programming_Language" value="Python">
        <label for="python">Python</label>

        <br>
        <br>

        <label for="pass"> Password : </label>
        <input type="password" id="pass" name="pass">
        <br>
        <br>

        <label for="cpass"> Confirm Password : </label>
        <input type="password" id="cpass" name="cpass">
        <br>
        <br>

        <input type="submit">
        <input type="reset">



    </form>
</body>
</html>
