<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10">
        <caption>Advanced HTML Table In Hindi</caption>
        <tr>
            <th rowspan="3"> Day</th>
            <th colspan="3">Seminar</th>
        </tr>
        <tr>
            <th colspan="2">Shedule</th>
            <th rowspan="2">Topic</th>
        </tr>
        <tr>
            <th>Start</th>
            <th>End</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8:00AM</td>
            <td rowspan="2">05:00PM</td>
            <td>Introducation</td>
        </tr>
        <tr>
            <td>Users</td>
        </tr>

        <tr>
            <td rowspan="4">Tuesday</td>
            <td>8:00AM</td>
            <td>11:00PM</td>
            <td>-</td>
        </tr>
        <tr>
            <td>11:00PM</td>
            <td>2:00PM</td>
            <td>Leam</td>
        </tr>

        <tr>
            <td>2:00PM</td>
            <td>8:00PM</td>
            <td rowspan="2"> - </td>
        </tr>

        <tr>
            <td>10:00AM</td>
            <td>1:00PM</td>
        </tr>
        <tr>
            <td>Wed-Fri</td>
            <td colspan="2">Full Day</td>
            <td>Practical</td>
        </tr>
        <tr>
            <td>Sat-Sun</td>
            <td colspan="2">11:00 AM - 05:00 PM</td>
            <td>Extra Class</td>
        </tr>


    </table>
</body>
</html>
