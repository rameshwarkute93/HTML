<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UL List</title>
</head>
<body>
    <ul type="disc">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <hr>

    <ul type="square">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <hr>

    <ul type="circle">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>
    
    <hr>
    
    <ul type="none">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>


</body>
</html>
